[project]
name = "vision-kv-inject"
version = "0.1.0"
description = "Inject vision encoder KV cache into LLM via per-layer adapters"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=5.15,<5.16",
    "accelerate>=1.0",
    "deepspeed>=0.15",
    "pillow>=10.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
vllm = ["vllm==0.23.0", "fla-core==0.5.2", "flash-attn==2.8.3.post1"]

[project.entry-points."vllm.general_plugins"]
delta_vision = "src.vllm_adapter:register"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
