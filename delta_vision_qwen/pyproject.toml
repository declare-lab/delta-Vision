[project]
name = "delta-vision"
version = "0.1.0"
description = "Layer-wise visual-effect distillation experiments for LLaVA-1.5."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "deepspeed>=0.15",
    "pillow>=10.0",
    "pyarrow>=18.0",
    "requests>=2.32",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=4.46",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["delta_vision*"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
